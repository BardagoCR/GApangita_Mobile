<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> ARCHIVE - GApangita? </title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="navbar__brand">
            <i class="fa-solid fa-box-open"></i>
            GApangita?</a>
        <div class="navbar__links">
            <a href="index.html" class="navbar__link">Home</a>
            <a href="report.html" class="navbar__link">Report Item</a>
            <a href="report.html" class="navbar__link">
                <i class="fa-solid fa-user-circle" style="margin-right: 8px;"></i>
            </a>
        </div>
    </nav>

    <div class="container">
        <header class="hero">
            <div class="text-side">
                <h1 class="hero__title"> Unarchive History </h1>
                <p> View Records of unarchived items with reasons why. </p>
            </div>
        </header>

        <div class="archive_link">
            <a href="archive.html" class="archive_link"><<< To Archive Page</a>
        </div>
        
        
        <section class="card">
            <div class="search-header">
                <div class="search-title-group">
                    <h2>Search Items with Unarchive History</h2>
                </div>

                <div class="filter-pill">
                    <span class="filter-pill__track"></span>
                    <button class="filter-btn active">All</button>
                    <button class="filter-btn">Lost</button>
                    <button class="filter-btn">Found</button>
                </div>
            </div>

            <div class="search-header-2">
                <div class="search-title-group">
                    <p>Use both filters to narrow down your results faster.</p>
                </div>

                <div class="page-pill">
                    <span class="page-pill__track"></span>
                    <button class="page-btn active">15</button>
                    <button class="page-btn">30</button>
                    <button class="page-btn">60</button>
                </div>
            </div>
    
            <div class="form-group">
                <h3>Item Name</h3>
                <input type="text" id="searchInput" class="form-input" placeholder="Type what you lost or found (e.g. 'black wallet', 'ID card')...">
            </div>
            
            <div class="form-group">
                <h3>Description Details</h3>
                <input type="text" id="searchDescInput" class="form-input" placeholder="Describe more details(color, brand location last seen, distinguishing marks)...">
            </div>

            <div class="filters-dropdown">

                <div class="filter-item">
                    <label for="category">Category</label>
                    <div class="select-wrapper">
                        <select id="categoryId">
                        </select>
                    </div>
                </div>

                <div class="filter-item">
                    <label for="branch">School Branch</label>
                    <div class="select-wrapper">
                        <select id="branchId">
                        </select>
                    </div>
                </div>

                <div class="filter-item">
                    <label for="location">Location</label>
                    <div class="select-wrapper">
                        <select id="locationId">
                            <option value="" selected disabled>Select Branch first...</option>
                        </select>
                    </div>
                </div>

            </div>

            <div id="resultsContainer" class="results-grid">
                <p>Start typing or select a filter to search...</p>
            </div>
            <div id="pages" class="pagination">
                <button id="prevPage">Prev </button>
                <span id="pageNumber"> 1 </span>
                <button id="nextPage"> Next</button>
            </div>
        </section>
    </div>

    <!-- Custom Modal System -->
    <div id="customModal" class="modal-overlay" style="display: none;">
        <div class="modal-container">
            <div class="modal-header">
                <h3 id="modalTitle">Notice</h3>
            </div>
            <div class="modal-body">
                <p id="modalMessage"></p>
            </div>
            <div class="modal-footer" id="modalFooter">
                <!-- Buttons will be injected here -->
            </div>
        </div>
    </div>

    <!-- RESULT TEMPLATE -->
    <template id="item-card-template">
    <div class="item-card">
        <img class="item-card__image" src="" alt="Item image" />

        <div class="item-card__header">
            <h3 class="item-card__title"></h3>

            <span class="item-card__badge"></span>
        </div>

        <p class="item-card__desc"></p>

        <div class="item-card__meta" style="display:flex; justify-content:space-between;">
            <span class="name-match"></span>
            <span class="desc-match"></span>
        </div>
    </div>
    </template>

<script src="config.js"></script>
<script src="utils.js"></script>

<script src="app.js"></script>

<script src="modal.js"></script>
<script src="auth.js"></script>

<script src="branchLocations.js"></script>
<script src="forms.js"></script>
<script src="claimCamera.js"></script>
<script src="items.js"></script>
<script src="search.js"></script>
<script src="unsavedChanges.js"></script>

</body>
</html>
